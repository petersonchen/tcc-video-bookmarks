<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MPY Timecode Marker 管理</title>
  <link rel="stylesheet" href="manage.css">
</head>
<body>
  <main>
    <header>
      <div class="title-row"><h1>MPY Timecode Marker 管理</h1><span id="version" class="version"></span></div>
    </header>

    <details class="card" open>
      <summary><h2>Marker</h2></summary>
      <div class="list-tools">
        <input id="search" type="search" placeholder="搜尋日期、網站、影片標題、Marker 標題" autocomplete="off">
        <span class="modes-label" id="modesLabel">點選 Marker：</span>
        <div id="modes" class="modes" role="group" aria-labelledby="modesLabel">
          <button data-mode="cue" title="點選 Marker：跳至該時間並暫停">CUE</button>
          <button data-mode="play" title="點選 Marker：跳至該時間並播放">PLAY</button>
          <button data-mode="edit" title="編輯或刪除 Marker">EDIT</button>
        </div>
      </div>
      <div id="list"></div>
      <div id="listEmpty" class="empty hidden"></div>
      <div id="listHint" class="hint hidden"></div>
    </details>

    <details class="card">
      <summary><h2>匯出</h2></summary>
      <p class="muted">依 Marker 的最後修改日篩選，產生純文字。</p>
      <div class="date-row">
        <label>從 <input id="exportFrom" type="date"></label>
        <label>到 <input id="exportTo" type="date"></label>
        <button id="exportBuild" class="primary">產生</button>
      </div>
      <div id="exportResult" class="hidden">
        <div id="exportSummary" class="summary"></div>
        <textarea id="exportText" readonly rows="12"></textarea>
        <button id="exportCopy" class="primary">複製</button>
        <span id="exportCopied" class="muted hidden">已複製</span>
      </div>
    </details>

    <details class="card">
      <summary><h2>匯入</h2></summary>
      <p class="muted">貼上匯出的文字。同一支影片會與現有 Marker 合併，時間與標題都相同的 Marker 會略過。</p>
      <textarea id="importText" rows="12" placeholder="MPY Timecode Marker v1&#10;…"></textarea>
      <button id="importPreview" class="primary">預覽</button>
      <div id="importResult" class="hidden">
        <div id="importSummary" class="summary"></div>
        <button id="importApply" class="primary">匯入</button>
      </div>
    </details>

    <details class="card">
      <summary><h2>設定</h2></summary>
      <label class="setting">未搜尋時顯示最近 <input id="recentDays" type="number" min="0" step="1"> 天的影片</label>
      <p class="muted">依影片的最後修改日計算，包含今天。0 表示全部顯示。搜尋時不受此設定限制。</p>
    </details>
  </main>
  <div id="toast" class="toast hidden"><span id="toastText"></span><button id="toastAction" class="hidden"></button></div>
  <script src="../lib/markers.js"></script>
  <script src="../sites/tcc.js"></script>
  <script src="../sites/youtube.js"></script>
  <script src="../lib/video-key.js"></script>
  <script src="manage.js"></script>
</body>
</html>
